# Publishes the HttpMock.Tool (global tool) and HttpMock.Server (in-process library) packages to NuGet.org.
# Triggered by pushing a version tag (e.g. v2.0.0) or manually from the Actions tab.

name: Publish NuGet Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore src/HttpServerMock.sln

      - name: Build
        run: dotnet build src/HttpServerMock.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/HttpServerMock.sln --configuration Release --no-build --verbosity normal

      - name: Pack HttpMock.Server
        run: dotnet pack src/HttpMock/HttpMock.csproj --configuration Release --no-build --output ./artifacts

      - name: Pack HttpMock.Tool
        run: dotnet pack src/HttpMock.Tool/HttpMock.Tool.csproj --configuration Release --no-build --output ./artifacts

      - name: Push to NuGet.org
        run: dotnet nuget push ./artifacts/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
